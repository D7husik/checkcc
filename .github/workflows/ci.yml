name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Новый push в ту же ветку отменяет ещё не завершённый старый запуск
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff check (линтер)
        run: ruff check . --output-format=github

      - name: Ruff format (форматирование)
        run: ruff format --check --diff .

  docker:
    name: Docker build & smoke check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: cicdcrm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: docker run -d --name app -p 8000:8000 cicdcrm:ci

      - name: Smoke check /health
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "App is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "App did not become healthy in 30s"
          exit 1

      - name: Container logs (on failure)
        if: failure()
        run: docker logs app

      - name: Stop container
        if: always()
        run: docker rm -f app || true
