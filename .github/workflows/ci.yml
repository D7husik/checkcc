name: ci

# Every PR and every push to a working branch: lint, tests, migration checks, image
# build. deploy-test.yml calls the same checks before it deploys. Everything runs on
# our own runner, labelled `ci`.
on:
  pull_request:
  push:
    branches-ignore: [main, test]
  workflow_call:
    inputs:
      build_image:
        description: Build the Docker image as a check (deploy-test builds its own)
        type: boolean
        default: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.24"

jobs:
  # Runs first. PRs into main come from test only: main gets exactly what was checked
  # on test. On a wrong PR it fails and the other jobs do not start. For anything that
  # is not a PR into main it is skipped, and the other jobs run as usual: hence their
  # `!failure() && !cancelled()`, which lets them run after a skipped source-branch.
  source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: [self-hosted, linux, ci]
    steps:
      - env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "test" ]; then
            echo "::error::PR into main must come from test (got $HEAD_REF). Merge into test first"
            exit 1
          fi

  lint:
    needs: source-branch
    if: ${{ !failure() && !cancelled() }}
    runs-on: [self-hosted, linux, ci]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run ruff check . --output-format=github
      - run: uv run ruff format --check --diff .
      - name: Shell scripts parse
        run: for f in scripts/*.sh scripts/host/*.sh deploy/runner/*.sh; do bash -n "$f"; done

  tests:
    needs: source-branch
    if: ${{ !failure() && !cancelled() }}
    runs-on: [self-hosted, linux, ci]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: checkcc_test
          MYSQL_USER: checkcc
          MYSQL_PASSWORD: checkcc
        # No fixed host port: this machine has other MySQL instances.
        ports: ["3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: mysql+pymysql://checkcc:checkcc@127.0.0.1:${{ job.services.mysql.ports['3306'] }}/checkcc_test

  migrations:
    needs: source-branch
    if: ${{ !failure() && !cancelled() }}
    runs-on: [self-hosted, linux, ci]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: checkcc_empty
        ports: ["3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run bash scripts/ci_migrations.sh
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:${{ job.services.mysql.ports['3306'] }}/checkcc_empty

  # Skipped only when deploy-test calls these checks: it builds the image itself.
  image:
    needs: source-branch
    if: ${{ !failure() && !cancelled() && (inputs.build_image || github.ref != 'refs/heads/test') }}
    runs-on: [self-hosted, linux, ci]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t "checkcc-ci:$GITHUB_SHA" .
      - if: always()
        run: docker rmi "checkcc-ci:$GITHUB_SHA" || true
